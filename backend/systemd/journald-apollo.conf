# Apollo journald policy — installed to /etc/systemd/journald.conf.d/apollo.conf
#
# Without this, a device that hangs abruptly leaves NO evidence: the default
# journal lives in /run (RAM) and vanishes on every boot, and /var/log is a zram
# ramdisk that only syncs to disk on a clean shutdown. Verified on apollo2
# (2026-07-20): an ordered reboot kept its logs, an abrupt hang minutes later
# lost everything — so "it restarted by itself" reports are undiagnosable.
#
# /var/log/journal is a symlink to /var/log.hdd/journal on the real eMMC, so
# Storage=persistent writes straight to disk, bypassing zram. journald's own
# fsync forces the write regardless of the ext4 commit interval, so this does
# NOT need armbian-ramlog or the mount's commit=600 (anti-wear) option touched.
[Journal]
Storage=persistent
SyncIntervalSec=10s
SystemMaxUse=200M
